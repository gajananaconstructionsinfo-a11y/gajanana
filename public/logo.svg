<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.35"/>

  <!-- Architectural Frame & Bold 'G' Monogram -->
  <g filter="url(#glow)">
    <!-- Main Outer Arch of 'G' -->
    <path d="M 370 156
             C 325 110, 240 100, 180 135
             C 115 174, 96 260, 130 330
             C 165 400, 250 425, 330 395
             C 380 376, 405 340, 412 288
             L 260 288
             L 260 236
             L 456 236
             C 460 320, 420 415, 340 452
             C 230 502, 110 455, 60 350
             C 12 248, 48 126, 142 72
             C 225 24, 342 36, 408 100
             Z"
          fill="url(#goldGrad)"/>

    <!-- Integrated High-Rise Columns Inside 'G' -->
    <!-- Column 1 (Left Structural Pier) -->
    <rect x="190" y="176" width="34" height="170" rx="8" fill="#ffffff" fill-opacity="0.95"/>
    <!-- Column 2 (Center Spire) -->
    <rect x="238" y="140" width="34" height="206" rx="8" fill="url(#accentGrad)"/>
    <!-- Column 3 (Right Anchor Pillar) -->
    <rect x="286" y="184" width="34" height="162" rx="8" fill="#ffffff" fill-opacity="0.95"/>

    <!-- Modern Foundation Ground Line -->
    <rect x="170" y="356" width="170" height="14" rx="7" fill="url(#goldGrad)"/>
  </g>
</svg>