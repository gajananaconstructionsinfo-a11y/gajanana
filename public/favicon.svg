<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>

  <!-- Solid rounded contrast base -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect x="14" y="14" width="484" height="484" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="12"/>

  <!-- Bold Architectural 'G' Monogram with maximum contrast for Google search snippet -->
  <!-- Outer Arch of 'G' -->
  <path d="M 374 150
           C 325 102, 238 96, 175 132
           C 108 172, 88 260, 122 334
           C 158 408, 246 432, 330 400
           C 382 380, 410 342, 416 288
           L 254 288
           L 254 232
           L 462 232
           C 468 325, 424 425, 340 462
           C 224 514, 98 464, 48 350
           C -2 240, 36 112, 136 56
           C 225 6, 350 18, 418 88
           Z"
        fill="url(#goldGrad)"/>

  <!-- Integrated 3 High-Rise Structural Columns -->
  <rect x="186" y="170" width="38" height="180" rx="6" fill="url(#pillarGrad)"/>
  <rect x="236" y="130" width="40" height="220" rx="6" fill="url(#goldGrad)"/>
  <rect x="288" y="180" width="38" height="170" rx="6" fill="url(#pillarGrad)"/>

  <!-- Foundation Beam -->
  <rect x="166" y="358" width="180" height="18" rx="8" fill="url(#goldGrad)"/>
</svg>